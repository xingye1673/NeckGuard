<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江男の颈椎守护者</title>
    
    <script src="js/pose.js"></script>
    <script src="js/camera_utils.js"></script>
    <script src="js/drawing_utils.js"></script>
    
    <style>
        /* 全局样式：科技黑风格 */
        body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        h2 { margin: 5px 0; font-size: 1.1rem; font-weight: 300; letter-spacing: 1px; color: #88c0d0; }

        /* 视频容器 */
        #container { 
            position: relative; width: 95%; max-width: 480px; height: 35vh; 
            background: #000; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); 
            border: 1px solid #333;
        }
        
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.8; }
        canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); }
        
        /* 提示覆盖层 */
        #overlay-msg {
            position: absolute; top: 10px; left: 0; width: 100%; text-align: center;
            color: #ff5555; font-weight: bold; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none; display: none;
        }

        /* iOS 风格 Toast 提示 */
        #toast {
            visibility: hidden; min-width: 200px; background-color: rgba(50, 50, 50, 0.95);
            color: #fff; text-align: center; border-radius: 50px; padding: 12px 24px;
            position: fixed; z-index: 100; left: 50%; bottom: 80px; transform: translateX(-50%);
            font-size: 0.95rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #444;
            opacity: 0; transition: opacity 0.3s, bottom 0.3s; pointer-events: none;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 100px; }

        /* 状态显示区 */
        #status-bar {
            margin-top: 10px; width: 90%; max-width: 450px;
            padding: 8px 15px; border-radius: 8px; background: #222; 
            display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid #444; transition: all 0.3s;
        }
        .status-ok { border-left-color: #4CAF50 !important; background: #1e2e1e; }
        .status-idle { border-left-color: #FFC107 !important; background: #2e2a15; }
        .status-alert { border-left-color: #F44336 !important; background: #2e1515; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); } }

        .big-text { font-size: 1.4rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        .small-text { font-size: 0.8rem; color: #aaa; }

        /* 控制面板 */
        #controls {
            margin-top: 10px; width: 90%; max-width: 450px;
            background: #1a1a1a; padding: 10px; border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .control-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .control-group:last-child { margin-bottom: 0; }
        
        label { color: #bbb; }
        
        input[type="number"] {
            background: #333; border: 1px solid #444; color: white; 
            padding: 5px; width: 60px; text-align: center; border-radius: 4px;
        }
        
        /* 滑动条样式 */
        input[type="range"] { -webkit-appearance: none; width: 120px; height: 4px; background: #444; border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #88c0d0; border-radius: 50%; cursor: pointer; }

        /* 按钮组 */
        .btn-group { display: flex; gap: 10px; justify-content: center; margin: 20px; }

        /* 通用按钮 */
        .btn {
            padding: 12px 25px; font-size: 15px; border: none; border-radius: 30px; 
            cursor: pointer; letter-spacing: 1px; color: white; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #startBtn { background: linear-gradient(45deg, #1976D2, #64B5F6); box-shadow: 0 4px 10px rgba(25, 118, 210, 0.4); }
        #calibBtn { background: linear-gradient(45deg, #009688, #4DB6AC); box-shadow: 0 4px 10px rgba(0, 150, 136, 0.4); display: none; }

    </style>
</head>
<body>

    <h2>江男の颈椎守护者</h2>
    
    <div id="container">
        <video id="input_video" playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div id="overlay-msg"></div>
    </div>
    
    <!-- 全局 Toast 提示 -->
    <div id="toast"></div>

    <!-- 状态条 -->
    <div id="status-bar" class="status-ok">
        <div>
            <div id="timer-display" class="big-text">--:--</div>
            <div id="msg-display" class="small-text">等待启动</div>
        </div>
        <div style="text-align: right;">
            <div id="status-icon" style="font-size: 1.5rem;">💤</div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="controls">
        <div class="control-group">
            <label>⏱️ 静止提醒 (分钟)</label>
            <!-- 默认 5 分钟，步进 0.1 分钟（方便测试，输入 0.2 就是 12秒） -->
            <input type="number" id="timeInput" value="5" step="0.1" min="0.1" onchange="updateSettings()">
        </div>
        <div class="control-group">
            <label>🐢 防低头/歪头 (秒)</label>
            <!-- 持续不良姿态多少秒后报警 -->
            <input type="number" id="postureTimeInput" value="5" step="1" min="1" onchange="updateSettings()">
        </div>
        <div class="control-group">
            <label>📏 低头容忍度</label>
            <div style="display:flex; align-items:center; gap:10px;">
                <input type="range" id="lowHeadInput" min="0.02" max="0.15" step="0.01" value="0.05" oninput="updateSettings()">
                <span id="lowHeadValue" style="color:#888; font-size:0.8rem; width:30px;">0.05</span>
            </div>
        </div>
        <div class="control-group">
            <label>📐 歪头容忍度</label>
            <div style="display:flex; align-items:center; gap:10px;">
                <input type="range" id="tiltInput" min="0.1" max="0.6" step="0.05" value="0.2" oninput="updateSettings()">
                <span id="tiltValue" style="color:#888; font-size:0.8rem; width:30px;">0.2</span>
            </div>
        </div>
        <div class="control-group">
            <label>🌊 活跃判定幅度</label>
            <div style="display:flex; align-items:center; gap:10px;">
                <input type="range" id="senseInput" min="0.01" max="0.15" step="0.01" value="0.08" oninput="updateSettings()">
                <span id="senseValue" style="color:#888; font-size:0.8rem; width:30px;">0.08</span>
            </div>
        </div>
        <div style="margin-top:5px; font-size:0.75rem; color:#666;">
            * 启动后请先保持标准坐姿，点击“校准”
        </div>
    </div>
    
    <div class="btn-group">
        <button id="startBtn" class="btn" onclick="startApp()">启动摄像头</button>
        <button id="calibBtn" class="btn" onclick="calibrate()">🎯 校准标准坐姿</button>
    </div>

    <div style="margin-top: 20px; font-size: 0.8rem; opacity: 0.6;">
        <a href="https://github.com/xingye1673/NeckGuard" target="_blank" style="color: #88c0d0; text-decoration: none; border-bottom: 1px dashed #88c0d0;">
            View on GitHub
        </a>
    </div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusBar = document.getElementById('status-bar');
    const timerDisplay = document.getElementById('timer-display');
    const msgDisplay = document.getElementById('msg-display');
    const statusIcon = document.getElementById('status-icon');
    const startBtn = document.getElementById('startBtn');
    const calibBtn = document.getElementById('calibBtn');
    const overlayMsg = document.getElementById('overlay-msg');
    const toast = document.getElementById('toast');
    
    // 输入控件
    const timeInput = document.getElementById('timeInput');
    const postureTimeInput = document.getElementById('postureTimeInput');
    const senseInput = document.getElementById('senseInput');
    const senseValue = document.getElementById('senseValue');
    const lowHeadInput = document.getElementById('lowHeadInput');
    const lowHeadValue = document.getElementById('lowHeadValue');
    const tiltInput = document.getElementById('tiltInput');
    const tiltValue = document.getElementById('tiltValue');

    // 动态配置变量
    let ALERT_THRESHOLD_SECONDS = 5 * 60; // 静止阈值
    let POSTURE_THRESHOLD_SECONDS = 5;    // 不良姿态持续阈值
    let MOVEMENT_THRESHOLD = 0.08;
    let LOW_HEAD_THRESHOLD = 0.05;
    let TILT_THRESHOLD = 0.2;

    // 状态变量
    let lastMoveTime = Date.now();
    let prevNose = null;
    let isAlerting = false; // 静止报警
    let isPostureAlerting = false; // 姿态报警
    
    // 姿态检测相关
    let isCalibrated = false;
    let standardPose = { noseY: 0, eyeAngle: 0 };
    let badPostureStartTime = 0; // 不良姿态开始时间

    let camera = null;
    let pose = null;
    let audioCtx = null;
    let nextBeepTime = 0;

    // 更新设置
    function updateSettings() {
        // 读取分钟转为秒
        let mins = parseFloat(timeInput.value);
        if(mins <= 0) mins = 0.1;
        ALERT_THRESHOLD_SECONDS = mins * 60;
        
        // 读取不良姿态秒数
        let pSecs = parseFloat(postureTimeInput.value);
        if(pSecs < 1) pSecs = 1;
        POSTURE_THRESHOLD_SECONDS = pSecs;

        // 读取灵敏度
        MOVEMENT_THRESHOLD = parseFloat(senseInput.value);
        senseValue.innerText = MOVEMENT_THRESHOLD;

        // 读取姿态阈值
        LOW_HEAD_THRESHOLD = parseFloat(lowHeadInput.value);
        lowHeadValue.innerText = LOW_HEAD_THRESHOLD;
        
        TILT_THRESHOLD = parseFloat(tiltInput.value);
        tiltValue.innerText = TILT_THRESHOLD;
        
        console.log(`Settings: Sedentary=${ALERT_THRESHOLD_SECONDS}s, Posture=${POSTURE_THRESHOLD_SECONDS}s, Sense=${MOVEMENT_THRESHOLD}, LowHead=${LOW_HEAD_THRESHOLD}, Tilt=${TILT_THRESHOLD}`);
    }

    // 显示 Toast 提示 (替代 alert)
    function showToast(msg) {
        toast.innerText = msg;
        toast.className = "show";
        // 3秒后自动消失
        setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // 校准功能
    function calibrate() {
        if (!prevNose) {
            showToast("⚠️ 未检测到人脸，请正对摄像头");
            return;
        }
        // 简单的校准：记录当前鼻子的Y坐标（归一化 0-1，越往下越大）
        // 记录双眼连线角度
        standardPose.noseY = prevNose.y;
        standardPose.eyeAngle = prevNose.angle || 0; // 这里简化，实际在onResults里算
        
        isCalibrated = true;
        showToast("✅ 校准成功！已记录标准坐姿");
        calibBtn.innerText = "🎯 重新校准";
    }

    // 蜂鸣器逻辑
    function playBeep(type = 'normal') {
        const now = Date.now();
        if (now < nextBeepTime) return;
        nextBeepTime = now + (type === 'urgent' ? 500 : 1000); 

        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.type = 'square'; 
        // 紧急报警（姿态）频率高一点，普通报警（久坐）低一点
        oscillator.frequency.value = type === 'urgent' ? 800 : 600; 
        
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.2); 
    }

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        let currentPostureStatus = "OK"; // OK, LOW_HEAD, TILT

        if (results.poseLandmarks) {
            // === 绘制逻辑 ===
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS,
                         {color: 'rgba(0, 255, 255, 0.6)', lineWidth: 1});
            drawLandmarks(canvasCtx, results.poseLandmarks,
                        {color: 'rgba(255, 255, 255, 0.8)', lineWidth: 0, radius: 1});
            
            const nose = results.poseLandmarks[0];
            const leftEar = results.poseLandmarks[7];
            const rightEar = results.poseLandmarks[8];

            // 绘制鼻子标记
            canvasCtx.beginPath();
            canvasCtx.arc(nose.x * canvasElement.width, nose.y * canvasElement.height, 5, 0, 2 * Math.PI);
            canvasCtx.fillStyle = isCalibrated ? '#00FF00' : '#FFFF00'; // 校准后变绿
            canvasCtx.fill();

            // === 1. 姿态检测逻辑 (基于校准) ===
            if (isCalibrated) {
                // A. 防低头检测
                // 逻辑：如果当前鼻子Y坐标 比 标准Y坐标 大（屏幕坐标系向下为大），且超过一定阈值
                const dropDiff = nose.y - standardPose.noseY;
                if (dropDiff > LOW_HEAD_THRESHOLD) { 
                    currentPostureStatus = "LOW_HEAD";
                }

                // B. 防歪头检测 (计算双耳连线角度)
                const dx = rightEar.x - leftEar.x;
                const dy = rightEar.y - leftEar.y;
                
                // 只要 dy/dx 的斜率过大就是歪头。
                if (Math.abs(dy / dx) > TILT_THRESHOLD) { 
                    currentPostureStatus = "TILT";
                }
            }

            // === 2. 久坐/活跃检测逻辑 ===
            const now = Date.now();
            if (!prevNose) {
                prevNose = nose;
                lastMoveTime = now;
            }
            const dist = Math.sqrt(Math.pow(nose.x - prevNose.x, 2) + Math.pow(nose.y - prevNose.y, 2));
            if (dist > MOVEMENT_THRESHOLD) {
                lastMoveTime = now;
                prevNose = nose;
                isAlerting = false; // 只要动了，久坐报警解除
            }

            // === 3. 综合状态处理 ===
            
            // 处理不良姿态计时
            if (currentPostureStatus !== "OK") {
                if (badPostureStartTime === 0) badPostureStartTime = now;
                
                const badDuration = (now - badPostureStartTime) / 1000;
                
                // 实时显示警告倒计时
                overlayMsg.style.display = "block";
                
                if (badDuration > POSTURE_THRESHOLD_SECONDS) {
                    isPostureAlerting = true;
                    playBeep('urgent');
                    
                    // 报警状态
                    overlayMsg.style.color = "#ff5555"; 
                    overlayMsg.style.fontSize = "1.5rem";
                    overlayMsg.innerText = currentPostureStatus === "LOW_HEAD" ? "⚠️ 别低头！皇冠会掉" : "⚠️ 脖子歪啦！";
                    
                    statusBar.className = "status-alert";
                    msgDisplay.innerText = "不良姿态警告";
                    statusIcon.innerText = "🦒";
                } else {
                    // 预警状态 (倒计时)
                    overlayMsg.style.color = "#FFC107"; // 橙色预警
                    overlayMsg.style.fontSize = "1.2rem";
                    const typeText = currentPostureStatus === "LOW_HEAD" ? "低头" : "歪头";
                    overlayMsg.innerText = `${typeText}警告: ${badDuration.toFixed(1)}s`;
                }
            } else {
                badPostureStartTime = 0;
                isPostureAlerting = false;
                overlayMsg.style.display = "none";
            }

            // 处理静止计时 (只有在姿态正常时才优先显示静止状态，避免冲突)
            if (!isPostureAlerting) {
                const idleSeconds = (now - lastMoveTime) / 1000;
                const timeLeft = Math.max(0, Math.ceil(ALERT_THRESHOLD_SECONDS - idleSeconds));

                if (idleSeconds > ALERT_THRESHOLD_SECONDS) {
                    isAlerting = true;
                    updateUI("alert");
                    timerDisplay.innerText = "⚠️ 身体僵硬警告";
                    msgDisplay.innerText = "长时间静止";
                    playBeep('normal');
                } else {
                    // 正常倒计时
                    const m = Math.floor(timeLeft / 60);
                    const s = timeLeft % 60;
                    timerDisplay.innerText = `${m}:${s < 10 ? '0' + s : s}`;
                    
                    // 如果刚刚动过
                    if (dist > MOVEMENT_THRESHOLD) updateUI("active");
                    else updateUI("static");
                }
            }
        }
        canvasCtx.restore();
    }

    function updateUI(state) {
        if (isPostureAlerting) return; // 姿态报警优先级最高

        statusBar.className = "";
        if (state === "active") {
            statusBar.classList.add("status-ok");
            msgDisplay.innerText = isCalibrated ? "监测中 (姿态良好)" : "监测中 (未校准)";
            statusIcon.innerText = "😊";
        } else if (state === "static") {
            if (!isAlerting) {
                statusBar.classList.add("status-idle");
                msgDisplay.innerText = isCalibrated ? "保持姿势..." : "等待校准...";
                statusIcon.innerText = "⏱️";
            }
        } else if (state === "alert") {
            statusBar.classList.add("status-alert");
            statusIcon.innerText = "🚨";
        }
    }

    async function startApp() {
        updateSettings(); 
        startBtn.disabled = true;
        startBtn.innerText = "正在启动...";
        
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        try {
            pose = new Pose({
                locateFile: (file) => `js/${file}`
            });
            
            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            pose.onResults(onResults);

            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            
            await camera.start();
            startBtn.style.display = 'none'; 
            calibBtn.style.display = 'block'; // 显示校准按钮

            // iOS Safari 后台切换优化
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) {
                    // 回到前台时，确保视频继续播放
                    if (videoElement.paused) {
                        videoElement.play().catch(e => console.log("Resume video failed", e));
                    }
                }
            });
            
        } catch (error) {
            alert("启动失败: " + error.message);
            startBtn.disabled = false;
            startBtn.innerText = "重试";
        }
    }
</script>
</body>
</html>
